<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBand - Kalradya</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Character Creation / Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="title-container">
                <div class="ornament top-ornament"></div>
                <h1>WebBand</h1>
                <div class="ornament bottom-ornament"></div>
                <p>Kalradya'ya Hoşgeldiniz</p>
            </div>
            <div class="form-group">
                <label>Karakter Adı:</label>
                <div class="input-container">
                    <input type="text" id="char-name" value="Maceracı" placeholder="İsmini gir...">
                </div>
                <button id="start-btn" class="btn primary">Maceraya Başla</button>
            </div>
            
            <div style="position: absolute; bottom: 40px; display:flex; gap: 2rem; justify-content:center; width:100%;">
                <button class="btn hex-btn-small" onclick="Game.showLore('lords')">🏇 Lordlar</button>
                <button class="btn hex-btn-small" onclick="Game.showLore('kingdoms')">🏰 Krallıklar</button>
                <button class="btn hex-btn-small" onclick="Save.continueGame()">📂 Kayıttan Devam</button>
                <button class="btn hex-btn-small" onclick="Save.open()">💾 Kayıtlar</button>
            </div>
            <!-- Sürüm damgası (#55 madde 8): hata raporunda hangi kod konuşuluyor -->
            <div id="ver-tag"></div>
        </div>

        <!-- Main Game UI -->
        <div id="main-ui" class="screen">
            <header id="top-bar" class="glass-panel">
                <!-- Sefer takvimi: gün + saat + günün vakti -->
                <div class="hud-chip tooltip-container" id="chip-time" onclick="Game.cycleTimeScale()">
                    <span class="hud-ico" id="ui-daypart">🌅</span>
                    <span class="hud-col">
                        <span class="hud-val"><span id="ui-day">1</span>. Gün</span>
                        <span class="hud-sub" id="ui-clock">08:00</span>
                    </span>
                    <div class="tooltip-content" id="tip-time"></div>
                </div>

                <div class="hud-sep"></div>

                <div class="hud-chip tooltip-container"><span class="hud-ico">💰</span>
                    <span class="hud-col"><span class="hud-val" id="ui-money">500</span><span class="hud-sub">dinar</span></span>
                    <div class="tooltip-content" id="tip-money"></div>
                </div>
                <div class="hud-chip tooltip-container" id="chip-food"><span class="hud-ico">🍞</span>
                    <span class="hud-col"><span class="hud-val" id="ui-food">—</span><span class="hud-sub" id="ui-food-sub">erzak</span></span>
                    <div class="tooltip-content" id="tip-food"></div>
                </div>
                <div class="hud-chip tooltip-container"><span class="hud-ico">⭐</span>
                    <span class="hud-col"><span class="hud-val" id="ui-renown">0</span><span class="hud-sub">nam</span></span>
                    <div class="tooltip-content" id="tip-renown"></div>
                </div>

                <div class="hud-sep"></div>

                <div class="hud-chip tooltip-container"><span class="hud-ico">❤️</span>
                    <span class="hud-col">
                        <span class="hud-val" id="ui-hp">50/50</span>
                        <span class="hud-bar"><i id="bar-hp" class="fill-hp" style="width:100%"></i></span>
                    </span>
                    <div class="tooltip-content" id="tip-hp"></div>
                </div>
                <div class="hud-chip tooltip-container"><span class="hud-ico">👥</span>
                    <span class="hud-col">
                        <span class="hud-val" id="ui-party">1/50</span>
                        <span class="hud-bar"><i id="bar-party" class="fill-party" style="width:2%"></i></span>
                    </span>
                    <div class="tooltip-content" id="tip-party"></div>
                </div>
                <div class="hud-chip tooltip-container"><span class="hud-ico">🎺</span>
                    <span class="hud-col">
                        <span class="hud-val" id="ui-morale">60</span>
                        <span class="hud-bar"><i id="bar-morale" class="fill-morale" style="width:60%"></i></span>
                    </span>
                    <div class="tooltip-content" id="tip-morale"></div>
                </div>
                <div class="hud-chip tooltip-container"><span class="hud-ico">⬆️</span>
                    <span class="hud-col">
                        <span class="hud-val">Sv. <span id="ui-level">1</span></span>
                        <span class="hud-bar"><i id="bar-xp" class="fill-xp" style="width:0%"></i></span>
                    </span>
                    <div class="tooltip-content" id="tip-level"></div>
                </div>

                <div class="hud-chip tooltip-container" id="chip-speed">
                    <span class="hud-ico" id="ui-speed-ico">🥾</span>
                    <span class="hud-col">
                        <span class="hud-val" id="ui-speed">50</span>
                        <span class="hud-sub" id="ui-speed-mode">yaya</span>
                    </span>
                    <div class="tooltip-content" id="ui-speed-breakdown"></div>
                </div>
            </header>

            <div class="content-area">
                <!-- Sidebar Menus -->
                <aside id="sidebar" class="glass-panel">
                    <div class="sb-title">Sefer</div>
                    <button class="menu-btn active" data-view="map" onclick="Game.showScreen('map')">
                        <span class="mb-ico">🗺️</span><span class="mb-lbl">Harita</span><kbd>M</kbd></button>
                    <button class="menu-btn" data-view="character" onclick="Game.showScreen('character')">
                        <span class="mb-ico">🛡️</span><span class="mb-lbl">Karakter</span><kbd>C</kbd></button>
                    <button class="menu-btn" data-view="party" onclick="Game.showScreen('party')">
                        <span class="mb-ico">⚔️</span><span class="mb-lbl">Grup</span><kbd>P</kbd></button>
                    <button class="menu-btn" data-view="inventory" onclick="Game.showScreen('inventory')">
                        <span class="mb-ico">🎒</span><span class="mb-lbl">Envanter</span><kbd>I</kbd></button>
                    <button class="menu-btn" data-view="quests" onclick="Game.showScreen('quests')">
                        <span class="mb-ico">📜</span><span class="mb-lbl">Görevler</span><kbd>Q</kbd></button>
                    <div style="flex:1"></div>
                    <div class="sb-title">Kayıt</div>
                    <button class="menu-btn" onclick="Save.open()">
                        <span class="mb-ico">💾</span><span class="mb-lbl">Kayıtlar</span></button>
                    <button class="menu-btn" onclick="Game.toggleMute()">
                        <span class="mb-ico" id="mute-ico">🔊</span><span class="mb-lbl" id="mute-lbl">Ses Açık</span></button>
                    <button class="menu-btn" onclick="Game.showSettings()">
                        <span class="mb-ico">⚙️</span><span class="mb-lbl">Ayarlar</span></button>
                </aside>

                <!-- Views Container -->
                <main id="view-container">
                    <!-- Map View -->
                    <div id="map-view" class="view active">
                        <canvas id="map-canvas"></canvas>
                        <div id="map-tooltip" class="glass-panel hidden"></div>
                        <!-- Grup künyesi: arazi + birlik dağılımı (Warband'ın grup penceresi gibi) -->
                        <div id="map-hud" class="glass-panel">
                            <div id="map-terrain"><span class="mh-ico">🧭</span><span id="map-terrain-txt">Düzlük</span></div>
                            <div id="map-comp"></div>
                        </div>
                    </div>

                    <!-- Settlement View (City/Castle/Village) -->
                    <div id="settlement-view" class="view glass-panel">
                        <h2 id="settlement-name">Şehir Adı</h2>
                        <div id="settlement-actions" class="action-list">
                        </div>
                    </div>

                    <!-- Character View -->
                    <div id="character-view" class="view glass-panel">
                        <h2>Karakter Ekranı</h2>
                        <div id="char-stats"></div>
                    </div>

                    <!-- Party View -->
                    <div id="party-view" class="view glass-panel">
                        <h2>Grup Yönetimi</h2>
                        <div id="party-list"></div>
                    </div>

                    <!-- Inventory View -->
                    <div id="inventory-view" class="view glass-panel">
                        <h2>Envanter</h2>
                        <div id="inventory-content"></div>
                    </div>

                    <!-- Quest View -->
                    <div id="quests-view" class="view glass-panel">
                        <h2>📜 Görevler</h2>
                        <div id="quest-list"></div>
                    </div>

                    <!-- Battle View -->
                    <div id="battle-view" class="view">
                        <canvas id="battle-canvas"></canvas>
                        <div id="battle-ui">
                            <div id="battle-log-left" class="battle-logs" style="left:20px; text-align:left;"></div>
                            <div id="battle-log-right" class="battle-logs" style="right:20px; text-align:right;"></div>
                            <button class="btn" id="btn-surrender" onclick="Battle.surrender()">🏳️ Teslim Ol</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Esaret paneli: durum + kaçış. Ayrı duran dev ⛓️ ikonu harita künyesinin
         üstüne biniyordu, panelin başlığına taşındı. -->
    <div id="prisoner-ui" class="glass-panel hidden">
        <h3>⛓️ Esaret Altındasın</h3>
        <div id="prisoner-info"></div>
        <div class="pr-chance">Kaçma Olasılığı: <strong id="ui-escape-chance">0%</strong></div>
        <div class="pr-actions">
            <button id="btn-escape-plan" class="btn" onclick="Game.toggleEscapePlan()">Kaçış Planı Yap</button>
            <button id="btn-escape-attempt" class="btn" onclick="Game.attemptEscape()">Kaçmaya Çalış</button>
        </div>
    </div>
    <!-- Kuşatma kampı paneli: hazırlık günleri, açlık, saldırı emri (#25) -->
    <div id="siege-ui" class="glass-panel hidden">
        <h3>🏰 Kuşatma Kampı</h3>
        <div id="siege-info"></div>
        <div class="pr-actions" style="margin-top:0.6rem">
            <button id="btn-siege-assault" class="btn" onclick="Game.assaultSiege()">⚔️ Saldırıya Geç</button>
            <button class="btn" onclick="Game.liftSiege()">🚪 Kuşatmayı Kaldır</button>
        </div>
    </div>
    <!-- Yağma paneli: 15 saniyelik ambar boşaltma, ilerleme ve yetişen lord (#49) -->
    <div id="raid-ui" class="glass-panel hidden">
        <h3>🔥 Yağma</h3>
        <div id="raid-info"></div>
        <div class="pr-actions" style="margin-top:0.6rem">
            <button class="btn" onclick="Game.abortRaid()">🚪 Yağmayı Bırak</button>
        </div>
    </div>
    <!-- Kamp paneli: bekleme süresi ve iptal (#53 madde 1.1) -->
    <div id="wait-ui" class="glass-panel hidden">
        <h3>⏳ Kamp</h3>
        <div id="wait-info"></div>
        <div class="pr-actions" style="margin-top:0.6rem">
            <button class="btn" onclick="Game.stopWait()">🚶 Kampı Topla</button>
        </div>
    </div>
    <!-- Hata rozeti (#55 madde 2): oyun sessizce ölmesin, konsolu açmayan da görsün -->
    <div id="err-badge" class="hidden" onclick="Debug.open()"></div>
    <!-- Modals -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content" class="glass-panel">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="battle.js"></script>
    <script src="nobles.js"></script>
    <script src="quests.js"></script>
</body>
</html>
