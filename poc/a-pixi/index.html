<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WebBand POC A — PixiJS</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 13px/1.35 -apple-system, system-ui, sans-serif; color: #eee; }
  * { touch-action: none; -webkit-user-select: none; user-select: none; }
  #host { position: fixed; inset: 0; }
  .stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* No backdrop-filter above the moving canvas (same rule as the game) — opaque panels only. */
  #bar { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px;
         padding: 6px 8px; background: rgba(12,14,10,0.82); z-index: 2; }
  #bar select, #bar button, #bar label { font: inherit; color: #eee; background: #2a2f24; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; }
  #bar button.primary { background: #6b4f1d; border-color: #c8a24a; }
  #stats { position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); white-space: pre; background: rgba(0,0,0,0.7);
           padding: 6px 8px; border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; z-index: 2; pointer-events: none; }
  #err { position: fixed; top: 50%; left: 16px; right: 16px; color: #ff8a7a; text-align: center; z-index: 3; }
  #results { position: fixed; inset: 10% 16px auto; background: #1b1d17; border: 1px solid #c8a24a; border-radius: 10px; padding: 12px; z-index: 4; }
  #results textarea { width: 100%; box-sizing: border-box; height: 40vh; background: #0e0f0c; color: #ddd; font: 11px/1.4 ui-monospace, Menlo, monospace; touch-action: auto; user-select: text; -webkit-user-select: text; }
  #results button { font: inherit; margin-top: 8px; padding: 6px 12px; }
</style>
</head>
<body>
<div id="host"></div>
<div id="bar">
  <select id="renderer" title="Çizici"></select>
  <select id="size" title="Ordu büyüklüğü (taraf başına)">
    <option value="20" selected>20v20</option><option value="100">100v100</option><option value="250">250v250</option>
  </select>
  <select id="fps" title="Kare hızı hedefi">
    <option value="screen" selected>Ekran hızı</option><option value="60">60 fps</option><option value="30">30 fps</option>
  </select>
  <label><input type="checkbox" id="interp" checked> İnterpolasyon</label>
  <button id="autocam">Oto kamera</button>
  <button id="bench" class="primary">Ölç (20 sn)</button>
  <button id="suite" class="primary">Hepsini ölç</button>
</div>
<div id="stats"></div>
<div id="err"></div>
<div id="results" hidden>
  <b>Ölçüm sonucu</b> — kopyalayıp bana gönder
  <textarea id="result-text" readonly></textarea>
  <button id="copy">Kopyala</button> <button id="close">Kapat</button>
</div>
<script src="vendor/pixi.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
